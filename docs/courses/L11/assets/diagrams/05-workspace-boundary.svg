<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker></defs><rect width="1600" height="900" fill="#fbfaf7"/><rect x="40" y="30" width="1520" height="70" rx="12" fill="#17324d"/><text x="800" y="75" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="white">先认清三个位置：准备在控制仓库，实际修改只在隔离候选</text><g font-family="Microsoft YaHei, sans-serif" fill="#172b43"><rect x="70" y="160" width="400" height="230" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="3"/><text x="270" y="215" text-anchor="middle" font-size="24" font-weight="700">① CodexFDE 控制仓库</text><text x="270" y="275" text-anchor="middle" font-size="20">运行第 1～4 步准备命令</text><text x="270" y="320" text-anchor="middle" font-size="20">保存课程、工作台、提交模板</text><rect x="600" y="160" width="400" height="230" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="800" y="215" text-anchor="middle" font-size="24" font-weight="700">② 独立 FlowERP 客户仓库</text><text x="800" y="275" text-anchor="middle" font-size="20">提供采购业务源码</text><text x="800" y="320" text-anchor="middle" font-size="20">不直接在这里完成本讲练习</text><rect x="1130" y="160" width="400" height="230" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="1330" y="215" text-anchor="middle" font-size="24" font-weight="700">③ 工作台返回的隔离候选</text><text x="1330" y="275" text-anchor="middle" font-size="20">第 5～6 步的唯一工作目录</text><text x="1330" y="320" text-anchor="middle" font-size="20">agent／flowerp／eval／tests</text><polygon points="350,500 750,500 720,610 320,610" fill="#ffe6cc" stroke="#d79b00" stroke-width="3"/><text x="535" y="545" text-anchor="middle" font-size="20">第 4.2 步提交任务</text><text x="535" y="580" text-anchor="middle" font-size="18">返回 task.id、isolation.path、status</text><polygon points="1035,470 1190,555 1035,640 880,555" fill="#fff2cc" stroke="#d6b656" stroke-width="3"/><text x="1035" y="530" text-anchor="middle" font-size="18">目录与源码</text><text x="1035" y="558" text-anchor="middle" font-size="18">都指向候选？</text><rect x="750" y="710" width="370" height="90" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="3"/><text x="935" y="748" text-anchor="middle" font-size="20" font-weight="700">不一致：停止</text><text x="935" y="780" text-anchor="middle" font-size="17">不要在其他仓库代做</text><rect x="1200" y="710" width="300" height="90" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="1350" y="763" text-anchor="middle" font-size="20" font-weight="700">一致：启动真实子 Agent</text></g><g fill="none" stroke="#65758b" stroke-width="4" marker-end="url(#a)"><path d="M270 390 L430 500"/><path d="M1000 275 L1130 275"/><path d="M750 555 L880 555"/><path d="M1330 390 L1190 500"/><path d="M980 640 L935 710"/><path d="M1090 640 L1320 710"/></g><g font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#172b43"><text x="955" y="688">否</text><text x="1200" y="675">是</text></g></svg>
