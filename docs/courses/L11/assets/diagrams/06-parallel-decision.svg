<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker></defs><rect width="1600" height="1000" fill="#fbfaf7"/><rect x="40" y="30" width="1520" height="70" rx="12" fill="#17324d"/><text x="800" y="75" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="white">能不能并行？不要只看文件名，按四层依赖逐项判断</text><g font-family="Microsoft YaHei, sans-serif" fill="#172b43"><ellipse cx="800" cy="180" rx="120" ry="40" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="800" y="188" text-anchor="middle" font-size="22" font-weight="700">两项任务</text><g fill="#fff2cc" stroke="#d6b656" stroke-width="3"><polygon points="800,270 960,335 800,400 640,335"/><polygon points="800,450 960,515 800,580 640,515"/><polygon points="800,630 960,695 800,760 640,695"/><polygon points="800,810 960,875 800,940 640,875"/></g><g text-anchor="middle" font-size="18"><text x="800" y="325">是否写同一文件</text><text x="800" y="352">或写目录覆盖文件？</text><text x="800" y="505">一方是否读取</text><text x="800" y="532">另一方正在修改的输入？</text><text x="800" y="685">是否共享数据库、端口、</text><text x="800" y="712">报告、缓存或临时目录？</text><text x="800" y="865">任务身份、输入版本、</text><text x="800" y="892">停止条件是否明确？</text></g><rect x="1110" y="450" width="360" height="120" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="3"/><text x="1290" y="500" text-anchor="middle" font-size="22" font-weight="700">拒绝并行</text><text x="1290" y="535" text-anchor="middle" font-size="18">重新划分、固定输入或改为串行</text><rect x="170" y="810" width="360" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="3"/><text x="350" y="860" text-anchor="middle" font-size="22" font-weight="700">允许启动并行</text><text x="350" y="895" text-anchor="middle" font-size="18">保留产物，最后串行整合</text></g><g fill="none" stroke="#65758b" stroke-width="4" marker-end="url(#a)"><path d="M800 220 L800 270"/><path d="M800 400 L800 450"/><path d="M800 580 L800 630"/><path d="M800 760 L800 810"/><path d="M960 335 L1110 480"/><path d="M960 515 L1110 515"/><path d="M960 695 L1290 570"/><path d="M960 875 L1290 570"/><path d="M640 875 L530 875"/></g><g font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#172b43"><text x="820" y="430">否</text><text x="820" y="610">否</text><text x="820" y="790">否</text><text x="1010" y="355">是</text><text x="1010" y="505">是</text><text x="1040" y="680">是</text><text x="1040" y="855">否</text><text x="580" y="855">是</text></g></svg>
