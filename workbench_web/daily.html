<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常研发 · 个人工作台</title><link rel="stylesheet" href="./styles.css"><style>body{display:block}main{max-width:1000px;margin:40px auto;padding:24px}textarea,input{width:100%;box-sizing:border-box}label{display:block;margin-top:18px}section{margin:24px 0;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:12px 8px 0 0}a{color:inherit}.task-row{display:block;text-align:left;width:100%}</style></head>
<body><main><a href="/">← 工作台总览与课程跟跑</a><h1>日常研发</h1><p>处理当前 FlowERP 项目的功能、缺陷和工作台改进。不需要选择讲次。</p>
<p id="readiness" role="status">正在检查执行环境…</p>
<section><h2>这次要解决什么</h2><form id="daily-form">
<label for="actor">你的署名</label><input id="actor" maxlength="80" required>
<label for="request">需求或问题</label><textarea id="request" rows="4" maxlength="2500" required placeholder="描述实际现象、预期行为，以及如何复现。"></textarea>
<label for="acceptance">怎样算完成</label><textarea id="acceptance" rows="3" maxlength="2000" required placeholder="写出可检查的结果，包括正常情况和异常情况。"></textarea>
<label for="scope">允许修改的文件或目录（每行一项）</label><textarea id="scope" rows="3" required placeholder="flowerp/&#10;tests/"></textarea>
<label for="non-goals">本次不做什么</label><input id="non-goals" maxlength="1000" value="不扩大本次需求范围">
<p>使用当前项目的源码副本，含尚未提交的修改。自动运行现有阻断检查；具体需求是否满足，仍需结合改动、相关测试和人工验收判断。</p>
<button id="prepare" type="submit" class="primary">准备执行方案</button></form>
<div id="plan" hidden><h3>本次执行方案</h3><pre id="plan-text"></pre><button id="authorize" class="primary">授权本次隔离执行</button></div>
<p id="message" role="status" aria-live="polite"></p></section>
<section><h2>研发任务</h2><button id="refresh">刷新记录</button><div id="tasks"></div></section>
<section id="result" hidden><h2 id="result-title"></h2><p id="task-state"></p><pre id="task-detail"></pre>
<details><summary>实际改动</summary><pre id="diff"></pre></details>
<details><summary>执行与检查记录</summary><pre id="events"></pre></details>
<label for="review-note">验收意见</label><textarea id="review-note" rows="2" placeholder="核对需求、改动和检查结果后填写"></textarea>
<button id="approve">验收候选成果</button><button id="reject">打回并保留原因</button>
<p>验收的是候选成果。隔离副本与完整 changes.patch 的位置保留在任务记录中；本入口不会自动把补丁合入源项目。</p></section>
</main><script src="./daily.js"></script></body></html>
